# Builds the rewinged container image on Azure DevOps.
#
# The image is built on every pull request so a change that breaks the build is
# caught before it lands, and pushed only from the default branch - a pull
# request from a fork must never be able to publish to an internal registry.
trigger:
  branches:
    include:
      - main
  tags:
    include:
      - '*'

pr:
  branches:
    include:
      - main

variables:
  # Repository path within that registry, e.g. 'infrastructure/rewinged'.
  repository: 'pscdev-containers-sandbox/rewinged'
  group: 'ProGet - PSCDEV-Containers-Sandbox'

stages:
  - stage: Test
    displayName: Test
    jobs:
      - job: gotest
        displayName: go build, vet and test
        pool: Lab_Linux
        steps:
          - script: |
              curl -sI https://storage.googleapis.com/golang/go1.25.9.linux-amd64.tar.gz | head -1
              curl -sI https://proxy.golang.org/gopkg.in/yaml.v3/@v/list | head -1
            displayName: Check remote sources

          # The toolchain comes from the golang image rather than GoTool@0. That
          # task fetches its tarball from the storage.googleapis.com/golang
          # bucket, which denies anonymous reads - every version answers 403
          # AccessDenied - so it cannot install any Go at all, on hosted and
          # self-hosted agents alike. Go itself is still published, at
          # dl.google.com/go; only the bucket the task uses is closed.
          #
          # The error names the version ("Failed to download version 1.25.9"),
          # which reads like a bad input rather than a dead source.
          #
          # This also keeps one toolchain in the pipeline: the tag here and the
          # builder stage in Dockerfile must match, so tests cannot pass on a
          # compiler the image is not built with. The tag has to satisfy the
          # `go` directive in go.mod, which the golang images will not silently
          # substitute.
          #
          # GOFLAGS disables VCS stamping. Go records the commit in binaries it
          # builds, which means shelling out to git, and git refuses a
          # repository owned by someone other than the calling user: the
          # workspace belongs to the agent account and this container runs as
          # root, so git exits 128 and takes the build with it. The stage
          # compiles to find compile errors and keeps no binary, so there is
          # nothing here for a commit stamp to end up in.
          #
          # The image build is not affected. COPY makes the sources root-owned
          # inside the image and the compiler runs as root, so the owners match
          # and stamping works - which is why Dockerfile does not set this.
          - script: |
              set -euo pipefail
              docker run --rm \
                -v "${SOURCES_DIR:-$PWD}":/src \
                -w /src \
                -e GOFLAGS=-buildvcs=false \
                golang:1.25 \
                sh -c 'go version && go build ./... && go vet ./... && go test ./...'
            displayName: Build, vet and test
            env:
              SOURCES_DIR: $(Build.SourcesDirectory)

  - stage: Image
    displayName: Container image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: image
        displayName: Build, smoke-test and push
        pool: Lab_Linux
        steps:
          - checkout: self
            # git describe needs history and tags; the default shallow fetch
            # would leave every build reporting the same version.
            fetchDepth: 0
            fetchTags: true

          - script: |
              set -euo pipefail

              # A tag build is named by its tag. Anything else is named by the
              # last tag plus the distance and commit, so an image built from
              # main is never mistaken for a release.
              VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 'development-build')"
              COMMIT="$(git rev-parse --short HEAD)"
              COMPILE_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              echo "version=${VERSION} commit=${COMMIT} compiled=${COMPILE_TIME}"
              echo "##vso[task.setvariable variable=imageVersion]${VERSION}"
              echo "##vso[task.setvariable variable=imageCommit]${COMMIT}"
              echo "##vso[task.setvariable variable=imageCompileTime]${COMPILE_TIME}"
              echo "##vso[build.updatebuildnumber]${VERSION}"
            displayName: Derive the version from git

          - script: |
              set -euo pipefail

              # Identical in every step that needs it. An unresolved pipeline
              # variable arrives either as the literal macro text or not at
              # all, and a step that handles only one of those disagrees with
              # the steps that handle both - which is how a build tagged
              # 'rewinged:...' while the smoke test looked for something else.
              IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-}"
              case "${IMAGE_REPOSITORY}" in ''|'$'*) IMAGE_REPOSITORY=rewinged ;; esac
              IMAGE_VERSION="${IMAGE_VERSION:-}"
              IMAGE_COMMIT="${IMAGE_COMMIT:-unknown}"
              IMAGE_COMPILE_TIME="${IMAGE_COMPILE_TIME:-unknown}"
              SOURCE_VERSION="${SOURCE_VERSION:-unknown}"

              echo "imageRepository resolved to '${IMAGE_REPOSITORY}'."

              # The version has no sensible default. It comes from the previous
              # step, and guessing one would tag an image with a version it does
              # not report - the exact confusion the smoke test exists to catch.
              case "${IMAGE_VERSION}" in
                ''|'$'*)
                  echo "imageVersion did not resolve (got '${IMAGE_VERSION}')."
                  echo "The 'Derive the version from git' step sets it with task.setvariable;"
                  echo "check that step ran and that this job can read what it set."
                  exit 1
                  ;;
              esac

              echo "building ${IMAGE_REPOSITORY}:${IMAGE_VERSION}"

              docker build \
                --build-arg "VERSION=${IMAGE_VERSION}" \
                --build-arg "COMMIT=${IMAGE_COMMIT}" \
                --build-arg "COMPILE_TIME=${IMAGE_COMPILE_TIME}" \
                --label "org.opencontainers.image.created=${IMAGE_COMPILE_TIME}" \
                --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
                --label "org.opencontainers.image.revision=${SOURCE_VERSION}" \
                --label "org.opencontainers.image.title=rewinged" \
                --label "org.opencontainers.image.description=rewinged is a self-hosted winget package source" \
                --label "org.opencontainers.image.licenses=MIT" \
                --tag "${IMAGE_REPOSITORY}:${IMAGE_VERSION}" \
                --tag "${IMAGE_REPOSITORY}:latest" \
                .
            displayName: Build the image
            env:
              IMAGE_REPOSITORY: $(imageRepository)
              IMAGE_VERSION: $(imageVersion)
              IMAGE_COMMIT: $(imageCommit)
              IMAGE_COMPILE_TIME: $(imageCompileTime)
              SOURCE_VERSION: $(Build.SourceVersion)

          - script: |
              set -euo pipefail

              # Identical in every step that needs it. An unresolved pipeline
              # variable arrives either as the literal macro text or not at
              # all, and a step that handles only one of those disagrees with
              # the steps that handle both - which is how a build tagged
              # 'rewinged:...' while the smoke test looked for something else.
              IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-}"
              case "${IMAGE_REPOSITORY}" in ''|'$'*) IMAGE_REPOSITORY=rewinged ;; esac

              # The version is not defaulted here. The build step exits non-zero
              # on an unresolved one, and it runs first, so reaching this step
              # means it resolved.
              IMAGE_VERSION="${IMAGE_VERSION:-}"

              # The image must report the version it was stamped with. A binary
              # that answers "development-build" here was built without the
              # build args, which is invisible until someone tries to pin it.
              reported="$(docker run --rm "${IMAGE_REPOSITORY}:${IMAGE_VERSION}" -version | head -n1)"
              echo "reported: ${reported}"

              case "${reported}" in
                *"${IMAGE_VERSION}"*) ;;
                *) echo "expected the image to report ${IMAGE_VERSION}"; exit 1 ;;
              esac
            displayName: Smoke-test the image
            env:
              IMAGE_REPOSITORY: $(imageRepository)
              IMAGE_VERSION: $(imageVersion)

          - script: |
              docker login --password pscproget01.int.cw.local/pscdev-containers-sandbox/
            displayName: Sign in to the registry

          - script: |
              set -euo pipefail

              # Identical in every step that needs it. An unresolved pipeline
              # variable arrives either as the literal macro text or not at
              # all, and a step that handles only one of those disagrees with
              # the steps that handle both - which is how a build tagged
              # 'rewinged:...' while the smoke test looked for something else.
              IMAGE_REPOSITORY="${IMAGE_REPOSITORY:-}"
              case "${IMAGE_REPOSITORY}" in ''|'$'*) IMAGE_REPOSITORY=rewinged ;; esac
              IMAGE_VERSION="${IMAGE_VERSION:-}"

              docker push "${IMAGE_REPOSITORY}:${IMAGE_VERSION}"
              docker push "${IMAGE_REPOSITORY}:latest"
            displayName: Push the image
            env:
              IMAGE_REPOSITORY: $(imageRepository)
              IMAGE_VERSION: $(imageVersion)

          - script: echo "api-key is unset or this is not a publishable ref - built and tested only."
            displayName: Report that the push was skipped
