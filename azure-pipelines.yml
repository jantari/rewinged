# Builds the rewinged container image on Azure DevOps.
#
# The image is built on every pull request so a change that breaks the build is
# caught before it lands, and pushed only from the default branch - a pull
# request from a fork must never be able to publish to an internal registry.
#
# Set `containerRegistry` below to the name of a Docker Registry service
# connection before the push steps will do anything. Left empty, the pipeline
# still builds and smoke-tests the image and skips the push, which is a useful
# state to run in while the registry is being decided.

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - '*'

pr:
  branches:
    include:
      - main

variables:
  # Name of the Docker Registry service connection in project settings.
  # Empty means "build but do not push".
  containerRegistry: ''
  # Repository path within that registry, e.g. 'infrastructure/rewinged'.
  imageRepository: 'rewinged'
  # Push only from the default branch. Tag builds also match, because a tag
  # build's SourceBranch is refs/tags/... rather than a branch.
  isPublishable: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'))]

stages:
  - stage: Test
    displayName: Test
    jobs:
      - job: gotest
        displayName: go build, vet and test
        pool:
          # Swap for `name: <your-pool>` to run on a self-hosted agent.
          vmImage: ubuntu-latest
        steps:
          # The toolchain comes from the golang image rather than GoTool@0. That
          # task fetches its tarball from the storage.googleapis.com/golang
          # bucket, which denies anonymous reads - every version answers 403
          # AccessDenied - so it cannot install any Go at all, on hosted and
          # self-hosted agents alike. Go itself is still published, at
          # dl.google.com/go; only the bucket the task uses is closed.
          #
          # The error names the version ("Failed to download version 1.25.9"),
          # which reads like a bad input rather than a dead source.
          #
          # This also keeps one toolchain in the pipeline: the tag here and the
          # builder stage in Dockerfile must match, so tests cannot pass on a
          # compiler the image is not built with. The tag has to satisfy the
          # `go` directive in go.mod, which the golang images will not silently
          # substitute.
          - script: |
              set -euo pipefail
              docker run --rm \
                -v "$(Build.SourcesDirectory)":/src \
                -w /src \
                golang:1.25 \
                sh -c 'go version && go build ./... && go vet ./... && go test ./...'
            displayName: Build, vet and test

  - stage: Image
    displayName: Container image
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: image
        displayName: Build, smoke-test and push
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            # git describe needs history and tags; the default shallow fetch
            # would leave every build reporting the same version.
            fetchDepth: 0
            fetchTags: true

          - script: |
              set -euo pipefail

              # A tag build is named by its tag. Anything else is named by the
              # last tag plus the distance and commit, so an image built from
              # main is never mistaken for a release.
              VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 'development-build')"
              COMMIT="$(git rev-parse --short HEAD)"
              COMPILE_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              echo "version=${VERSION} commit=${COMMIT} compiled=${COMPILE_TIME}"
              echo "##vso[task.setvariable variable=imageVersion]${VERSION}"
              echo "##vso[task.setvariable variable=imageCommit]${COMMIT}"
              echo "##vso[task.setvariable variable=imageCompileTime]${COMPILE_TIME}"
              echo "##vso[build.updatebuildnumber]${VERSION}"
            displayName: Derive the version from git

          - script: |
              set -euo pipefail
              docker build \
                --build-arg "VERSION=$(imageVersion)" \
                --build-arg "COMMIT=$(imageCommit)" \
                --build-arg "COMPILE_TIME=$(imageCompileTime)" \
                --label "org.opencontainers.image.created=$(imageCompileTime)" \
                --label "org.opencontainers.image.version=$(imageVersion)" \
                --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                --label "org.opencontainers.image.title=rewinged" \
                --label "org.opencontainers.image.description=rewinged is a self-hosted winget package source" \
                --label "org.opencontainers.image.licenses=MIT" \
                --tag "$(imageRepository):$(imageVersion)" \
                --tag "$(imageRepository):latest" \
                .
            displayName: Build the image

          - script: |
              set -euo pipefail

              # The image must report the version it was stamped with. A binary
              # that answers "development-build" here was built without the
              # build args, which is invisible until someone tries to pin it.
              reported="$(docker run --rm "$(imageRepository):$(imageVersion)" -version | head -n1)"
              echo "reported: ${reported}"

              case "${reported}" in
                *"$(imageVersion)"*) ;;
                *) echo "expected the image to report $(imageVersion)"; exit 1 ;;
              esac
            displayName: Smoke-test the image

          - task: Docker@2
            displayName: Sign in to the registry
            condition: and(succeeded(), ne(variables['containerRegistry'], ''), eq(variables.isPublishable, true))
            inputs:
              command: login
              containerRegistry: $(containerRegistry)

          - script: |
              set -euo pipefail
              docker push "$(imageRepository):$(imageVersion)"
              docker push "$(imageRepository):latest"
            displayName: Push the image
            condition: and(succeeded(), ne(variables['containerRegistry'], ''), eq(variables.isPublishable, true))

          - script: echo "containerRegistry is unset or this is not a publishable ref - built and tested only."
            displayName: Report that the push was skipped
            condition: and(succeeded(), or(eq(variables['containerRegistry'], ''), ne(variables.isPublishable, true)))
